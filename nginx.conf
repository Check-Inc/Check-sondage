server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Fichiers générés par Vite : leur nom contient une empreinte, ils peuvent rester en cache longtemps
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html ne doit pas rester en cache, sinon une nouvelle version n'apparaît pas
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
